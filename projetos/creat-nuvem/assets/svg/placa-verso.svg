<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 200" role="img" aria-labelledby="placa-verso-titulo placa-verso-desc">
<title id="placa-verso-titulo">Verso da placa</title>
<desc id="placa-verso-desc">Verso da placa de madeira, sem texto, com a nuvem da Creat queimada na madeira. Aparece no meio do giro.</desc>
<style>
.pl-tinta{fill:var(--sol-tinta,#1E1B2E)}
.pl-sombra{fill:var(--linha,#1E1B2E)}
.pl-contorno{stroke:var(--linha,#1E1B2E);stroke-linejoin:round;stroke-linecap:round}
.pl-madeira{fill:var(--madeira,#D39A5B)}
.pl-madeira-clara{fill:var(--madeira-clara,#E6B67B)}
.pl-madeira-sombra{fill:var(--madeira-sombra,#7A4B2A)}
.pl-veio{fill:none;stroke:var(--madeira-veio,#9A6438);stroke-width:2.5;stroke-linecap:round}
.pl-lousa{fill:var(--lousa,#22322D)}
.pl-sol{fill:var(--sol,#FFC93C)}
.pl-giz{fill:var(--giz,#F4F1E6)}
.pl-giz-traco{fill:none;stroke:var(--giz,#F4F1E6);stroke-linecap:round}
.pl-poeira{fill:var(--giz-apagado,#AEBBB4)}
.pl-metal{fill:var(--corrente,#8C909B)}
.pl-elo{fill:none;stroke:var(--corrente,#8C909B);stroke-width:3.2}
.pl-elo-brilho{fill:none;stroke:var(--corrente-brilho,#E7E9EF);stroke-width:1.2;stroke-linecap:round}
.pl-elo-tinta{fill:none;stroke:var(--linha,#1E1B2E);stroke-width:6.4}
.pl-display{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif}
.pl-texto{font-family:Figtree,system-ui,sans-serif;font-weight:800}
</style><g id="face-verso"><defs><clipPath id="pl-clip-verso"><rect x="10" y="14" width="300" height="172" rx="22"/></clipPath></defs>
<rect class="pl-sombra" x="16" y="20" width="300" height="172" rx="22"/>
<g id="verso-tabua">
<rect class="pl-madeira" x="10" y="14" width="300" height="172" rx="22"/>
<g clip-path="url(#pl-clip-verso)"><rect class="pl-madeira-clara" x="0" y="0" width="330" height="34"/><rect class="pl-madeira-sombra" x="0" y="160" width="330" height="40"/>
<g id="verso-veios"><path class="pl-veio" d="M30 52 C70 44 110 60 150 50"/><path class="pl-veio" d="M190 46 C220 40 255 54 292 46"/><path class="pl-veio" d="M24 146 C64 138 96 152 136 144"/><path class="pl-veio" d="M206 150 C236 140 262 156 296 148"/><ellipse class="pl-veio" cx="262" cy="96" rx="9" ry="5"/><path class="pl-veio" d="M240 92 C250 84 274 84 286 94"/></g></g>
<rect fill="none" class="pl-contorno" stroke-width="5" x="10" y="14" width="300" height="172" rx="22"/>
</g>
