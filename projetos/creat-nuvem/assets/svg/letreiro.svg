<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-labelledby="letreiro-titulo letreiro-desc">
<title id="letreiro-titulo">Letreiro do negócio</title>
<desc id="letreiro-desc">Letreiro de fachada em amarelo com contorno de nanquim e duas luminárias acesas, com o nome do negócio e a legenda Aberto pela Creat Nuvem.</desc>
<style>
.le-tinta{fill:var(--tinta,#1E1B2E)}.le-linha{stroke:var(--linha,#1E1B2E);stroke-linejoin:round;stroke-linecap:round}
.le-sol{fill:var(--sol,#FFC93C)}.le-sol-tinta{fill:var(--sol-tinta,#1E1B2E)}.le-papel{fill:var(--papel,#FFFDF6)}
.le-metal{fill:var(--corrente,#8C909B)}.le-luz{fill:var(--vidro-luz,#FFD98A)}.le-sombra{fill:var(--linha,#1E1B2E)}
.le-display{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif}.le-texto{font-family:Figtree,system-ui,sans-serif;font-weight:800}
</style>
<g id="luz-esq" opacity=".55"><path class="le-luz" d="M110 52 L60 120 L200 120 L150 52 Z"/></g>
<g id="luz-dir" opacity=".55"><path class="le-luz" d="M510 52 L460 120 L600 120 L550 52 Z"/></g>
<rect class="le-sombra" x="26" y="86" width="620" height="136" rx="20"/>
<g id="tabua-letreiro"><rect class="le-sol le-linha" stroke-width="5" x="20" y="80" width="620" height="136" rx="20"/><rect fill="none" class="le-linha" stroke-width="2.5" stroke-dasharray="2 9" x="34" y="94" width="592" height="108" rx="12"/></g>
<text id="letreiro-nome" class="le-display le-sol-tinta" x="330" y="160" font-size="60" text-anchor="middle" data-max-caracteres="28">Seu negócio</text>
<text id="letreiro-legenda" class="le-texto le-sol-tinta" x="330" y="196" font-size="17" letter-spacing="3" text-anchor="middle">ABERTO PELA CREAT NUVEM</text>
<g id="lampada-esq"><path fill="none" class="le-linha" stroke-width="6" d="M130 80 V30 H130 "/><path class="le-metal le-linha" stroke-width="4" d="M104 30 H156 L146 52 H114 Z"/><ellipse class="le-luz le-linha" stroke-width="3" cx="130" cy="54" rx="14" ry="6"/></g><g id="lampada-dir"><path fill="none" class="le-linha" stroke-width="6" d="M530 80 V30 H530 "/><path class="le-metal le-linha" stroke-width="4" d="M504 30 H556 L546 52 H514 Z"/><ellipse class="le-luz le-linha" stroke-width="3" cx="530" cy="54" rx="14" ry="6"/></g>
</svg>
