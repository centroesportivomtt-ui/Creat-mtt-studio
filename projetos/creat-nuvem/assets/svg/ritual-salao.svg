<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="ritual-salao-titulo ritual-salao-desc">
<title id="ritual-salao-titulo">Pincel e unha</title>
<desc id="ritual-salao-desc">Ponta de um dedo com a unha sendo pintada pelo pincel do esmalte, com o vidrinho de esmalte ao lado.</desc>
<style>
.rs-l{stroke:var(--linha,#1E1B2E);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.rs-lf{fill:none;stroke:var(--linha,#1E1B2E);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rs-sombra{fill:var(--linha,#1E1B2E)}
.rs-aco{fill:#D9DDE0}.rs-aco-escuro{fill:#A9AFB6}.rs-brilho{fill:none;stroke:#FFFFFF;stroke-width:2.5;stroke-linecap:round}
.rs-destaque{fill:var(--n-destaque,#A8123A)}.rs-tinta{fill:var(--linha,#1E1B2E)}.rs-papel{fill:var(--papel,#FFFDF6)}
</style><style>.rs-unha-base{fill:#FBEFE8}.rs-pele{fill:var(--pele,#F2C7A5)}</style>
<defs><clipPath id="rs-clip-unha"><path d="M74 118 V84 Q74 58 95 58 Q116 58 116 84 V118 Q95 126 74 118 Z"/></clipPath></defs>
<g id="dedo">
<path class="rs-sombra" d="M58 204 V78 Q58 36 95 36 Q132 36 132 78 V204 Z" transform="translate(5 4)"/>
<path id="dedo-pele" class="rs-pele rs-l" d="M58 204 V78 Q58 36 95 36 Q132 36 132 78 V204 Z"/>
<path id="dedo-dobra" class="rs-lf" d="M74 166 Q95 172 116 166 M78 178 Q95 183 112 178"/>
</g>
<g id="unha">
<path id="unha-base" class="rs-unha-base rs-l" stroke-width="3" d="M74 118 V84 Q74 58 95 58 Q116 58 116 84 V118 Q95 126 74 118 Z"/>
<g id="esmalte" clip-path="url(#rs-clip-unha)"><rect id="esmalte-preenchimento" class="rs-destaque" x="70" y="54" width="50" height="76"/></g>
<path id="esmalte-reflexo" class="rs-brilho" stroke-width="3.5" d="M84 98 V86 Q84 74 92 70"/>
<path fill="none" class="rs-l" stroke-width="3.5" d="M74 118 V84 Q74 58 95 58 Q116 58 116 84 V118 Q95 126 74 118 Z"/>
</g>
<g id="pincel" transform="rotate(30 150 70)">
<rect class="rs-sombra" x="142" y="8" width="20" height="66" rx="6" transform="translate(3 3)"/>
<rect id="pincel-cabo" class="rs-tinta rs-l" x="142" y="8" width="20" height="66" rx="6"/>
<path id="pincel-haste" class="rs-lf" d="M152 74 V90"/>
<path id="pincel-cerdas" class="rs-destaque rs-l" stroke-width="3" d="M144 88 H160 L158 110 Q152 118 146 110 Z"/>
<circle id="pincel-gota" class="rs-destaque rs-l" stroke-width="2.5" cx="152" cy="126" r="4.5"/>
</g>
<g id="frasco">
<rect class="rs-sombra" x="150" y="128" width="40" height="56" rx="12" transform="translate(3 3)"/>
<rect id="frasco-vidro" class="rs-papel rs-l" x="150" y="128" width="40" height="56" rx="12"/>
<rect id="frasco-liquido" class="rs-destaque" x="155" y="144" width="30" height="35" rx="8"/>
<path class="rs-brilho" d="M159 136 V144"/>
<rect id="frasco-tampa" class="rs-tinta rs-l" x="160" y="108" width="20" height="22" rx="4"/>
</g>
</svg>
