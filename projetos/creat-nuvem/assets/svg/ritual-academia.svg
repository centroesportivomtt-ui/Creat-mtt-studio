.ra-sombra{fill:var(--linha,#1E1B2E)}
.ra-aco{fill:#D9DDE0}.ra-aco-escuro{fill:#A9AFB6}.ra-brilho{fill:none;stroke:#FFFFFF;stroke-width:2.5;stroke-linecap:round}
.ra-destaque{fill:var(--n-destaque,#B8141E)}.ra-tinta{fill:var(--tinta,#1E1B2E)}.ra-papel{fill:var(--papel,#FFFDF6)}
</style><style>.ra-anilha-2{fill:var(--tinta,#1E1B2E)}.ra-giz{fill:#FFFFFF}.ra-recartilhado{fill:none;stroke:#8C909B;stroke-width:1.5}</style>
