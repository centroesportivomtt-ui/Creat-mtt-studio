<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 112" role="img" aria-labelledby="corrente-titulo corrente-desc">
<title id="corrente-titulo">Correntinha</title>
<desc id="corrente-desc">Prego com duas correntinhas que descem até as argolas da placa.</desc>
<style>
.pl-tinta{fill:var(--tinta,#1E1B2E)}
.pl-sombra{fill:var(--linha,#1E1B2E)}
.pl-contorno{stroke:var(--linha,#1E1B2E);stroke-linejoin:round;stroke-linecap:round}
.pl-madeira{fill:var(--madeira,#D39A5B)}
