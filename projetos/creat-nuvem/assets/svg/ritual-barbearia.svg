<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="ritual-barbearia-titulo ritual-barbearia-desc">
<title id="ritual-barbearia-titulo">Navalha e couro</title>
<desc id="ritual-barbearia-desc">Navalha aberta deslizando sobre a tira de couro de afiar, com argola de metal numa ponta e alça na outra.</desc>
<style>
.rb-l{stroke:var(--linha,#1E1B2E);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.rb-lf{fill:none;stroke:var(--linha,#1E1B2E);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rb-sombra{fill:var(--linha,#1E1B2E)}
.rb-aco{fill:#D9DDE0}.rb-aco-escuro{fill:#A9AFB6}.rb-brilho{fill:none;stroke:#FFFFFF;stroke-width:2.5;stroke-linecap:round}
.rb-destaque{fill:var(--n-destaque,#7A4E1D)}.rb-tinta{fill:var(--tinta,#1E1B2E)}.rb-papel{fill:var(--papel,#FFFDF6)}
</style><style>.rb-couro{fill:#9A5B2E}.rb-couro-sombra{fill:#6E3E1D}.rb-costura{fill:none;stroke:#F1D9B5;stroke-width:2;stroke-dasharray:5 5;stroke-linecap:round}.rb-cabo{fill:var(--n-destaque,#7A4E1D)}</style>
<g id="couro">
<rect class="rb-sombra" x="30" y="124" width="150" height="36" rx="8"/>
<rect id="couro-tira" class="rb-couro rb-l" x="26" y="120" width="150" height="36" rx="8"/>
<rect class="rb-couro-sombra" x="30" y="144" width="142" height="9" rx="4"/>
<path id="couro-costura" class="rb-costura" d="M34 128 H168"/>
<g id="couro-argola"><circle fill="none" stroke="var(--linha,#1E1B2E)" stroke-width="8" cx="16" cy="138" r="11"/><circle fill="none" stroke="#A9AFB6" stroke-width="3.5" cx="16" cy="138" r="11"/></g>
<g id="couro-alca"><rect class="rb-tinta rb-l" x="172" y="128" width="20" height="20" rx="6"/></g>
</g>
<g id="navalha">
<g id="navalha-cabo"><path class="rb-sombra" d="M64 104 L18 66 Q12 60 18 56 Q24 52 30 58 L72 98 Z" transform="translate(3 3)"/><path class="rb-cabo rb-l" d="M64 104 L18 66 Q12 60 18 56 Q24 52 30 58 L72 98 Z"/><circle class="rb-aco rb-l" stroke-width="2.5" cx="26" cy="62" r="3.5"/></g>
<g id="navalha-lamina"><path class="rb-sombra" d="M62 92 H156 Q170 92 170 104 Q170 114 156 116 L70 116 Q60 112 62 92 Z" transform="translate(3 3)"/><path class="rb-aco rb-l" d="M62 92 H156 Q170 92 170 104 Q170 114 156 116 L70 116 Q60 112 62 92 Z"/><path class="rb-aco-escuro" d="M66 96 H154 Q164 96 165 100 H68 Z"/><path id="navalha-fio" class="rb-brilho" d="M76 111 H152"/></g>
<circle id="navalha-pino" class="rb-tinta rb-l" stroke-width="2.5" cx="68" cy="100" r="5"/>
</g>
<g id="brilhos" class="rb-lf"><path id="brilho-1" d="M180 86 L190 78"/><path id="brilho-2" d="M182 100 L194 100"/><path id="brilho-3" d="M176 72 L180 62"/></g>
</svg>
