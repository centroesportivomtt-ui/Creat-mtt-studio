<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 300" role="img" aria-labelledby="placa-titulo placa-desc">
<title id="placa-titulo">Placa FECHADO</title>
<desc id="placa-desc">Placa de madeira presa por correntinha num prego, mostrando FECHADO. Ao virar, mostra ABERTO com o nome do negócio em giz.</desc>
