<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entregas creat.MTT</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icone-192.png"><link rel="apple-touch-icon" href="icone-180.png"><meta name="apple-mobile-web-app-title" content="Entregas"><meta name="theme-color" content="#e3121b">
<style>
:root{--bg:#0f0d0c;--card:#1b1716;--tx:#f6efe9;--mut:#a89c94;--ac:#e3121b;--y:#ffd23f}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 60px max(12px,env(safe-area-inset-left))}
header{max-width:960px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:22px;letter-spacing:-.02em}h1 b{color:var(--ac)}#at{color:var(--mut);font-size:13px}
main{max-width:960px;margin:0 auto}h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);margin:26px 0 10px}
.proj{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.proj h3{font-size:17px;margin-bottom:10px}.proj h3 span{color:var(--mut);font-weight:400;font-size:13px;margin-left:8px}
.itens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}@media(min-width:700px){.itens{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.it{background:#251f1d;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.it video,.it img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
.it .n{padding:8px 10px 2px;font-size:12px;word-break:break-all;line-height:1.3}.it .m{padding:0 10px;color:var(--mut);font-size:12px}
.it a{margin:8px 10px 10px;text-align:center;background:var(--ac);color:#fff;text-decoration:none;border-radius:8px;padding:11px 8px;font-weight:700;font-size:14px;min-height:44px}
#vazio{color:var(--mut)}
.onde2{margin:0 0 10px;font-size:13px;color:var(--mut)}.onde2 .ch{display:inline-block;margin:4px 6px 0 0;padding:7px 12px;border-radius:999px;background:#251f1d;color:var(--tx);border:1px solid #3a302d;font-weight:700;font-size:13px;cursor:pointer}.onde2 .ch.on{background:#5b7fd6;border-color:#5b7fd6;color:#fff}.onde2 .ch.add{border-style:dashed;color:var(--y)}
.it a.b2{background:#3a302d;margin-top:0}.novo{background:var(--y);color:#241612;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:8px;vertical-align:middle}
#rf{background:#3a302d;color:var(--tx);border:0;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
#bq{max-width:960px;margin:0 auto 6px;display:flex;gap:8px}#bq input{flex:1;background:var(--card);border:1px solid #3a302d;color:var(--tx);border-radius:10px;padding:10px 12px;font-size:16px}
.leg{margin-top:12px;background:#251f1d;border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap}.leg button,.st button{background:var(--y);color:#241612;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;margin-top:8px;cursor:pointer}
.sel{color:#fff;border-radius:8px;padding:6px 12px;font-weight:800;font-size:13px}.abas{max-width:960px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto}.abas button{white-space:nowrap;background:#251f1d;color:var(--tx);border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}.abas button.on{background:var(--y);color:#241612}.st{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap;align-items:center}.st button{margin:0;background:#3a302d;color:var(--tx);font-weight:600}.st button.on{background:var(--ac);color:#fff}
.sem{color:var(--mut);font-size:13px;margin-top:10px}
</style></head><body>
<header><h1><img src="logo-creat.png" alt="creat.MTT" style="height:30px;display:block"><span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600">Entregas</span></h1><div><span id="at">carregando…</span> <button id="rf" onclick="location.reload()">Atualizar</button></div></header>
<div class="abas" id="abas"></div>
<div id="bq" style="margin-top:10px"><input id="q" type="search" placeholder="Buscar cliente, projeto ou arquivo…" autocomplete="off"></div>
<main id="m"><p id="vazio">Carregando entregas…</p></main>
<script>
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const IDX="_painel/e160f58517f4.json";
const mb=t=>(t/1048576).toFixed(1).replace(".",",")+" MB";
const nome=s=>s.replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const META="_painel/e160f58517f4-meta.json";
const CL=new URLSearchParams(location.search).get("c");
const ST=["Para revisar","Aprovado","Postado"],PROX={"Para revisar":"Marcar como aprovado","Aprovado":"Marcar como postado","Postado":"Voltar para revisar"},COR={"Para revisar":"#e3121b","Aprovado":"#2e9e5b","Postado":"#5b7fd6"};
let FIL="Todos";
const J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},SJ=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const perfis=()=>J("perfis",["@creat.mtt","Super Kal","Elite Drako Gym"]).map(x=>x==="Elite Draco Gin"?"Elite Drako Gym":x);
const lg=k=>{try{return localStorage.getItem("st:"+k)||ST[0]}catch(e){return ST[0]}};
const sg=(k,v)=>{try{localStorage.setItem("st:"+k,v)}catch(e){}};
Promise.all([fetch(IDX,{cache:"no-store"}).then(r=>r.json()),fetch(META,{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,meta])=>{
  document.getElementById("at").textContent="atualizado "+d.atualizado;
  const m=document.getElementById("m");m.innerHTML="";
  const cli={};
  for(const it of d.itens){const[c,p]=it.k.split("/");if(CL&&c!==CL)continue;((cli[c]??={})[p]??=[]).push(it);}
  for(const c of Object.keys(cli).sort()){
    const h=document.createElement("h2");h.textContent=nome(c);m.append(h);
    for(const p of Object.keys(cli[c]).sort().reverse()){
      const box=document.createElement("section");box.className="proj";
      const t=document.createElement("h3");t.textContent=nome(p.slice(11));const s=document.createElement("span");s.textContent=p.slice(8,10)+"/"+p.slice(5,7)+"/"+p.slice(0,4);t.append(s);if((Date.now()-new Date(p.slice(0,10)+"T12:00:00-03:00"))<2*86400e3){const nv=document.createElement("span");nv.className="novo";nv.textContent="NOVO";t.append(nv)}box.append(t);
      const g=document.createElement("div");g.className="itens";
      for(const it of cli[c][p]){
        const f=it.k.split("/").pop(),u=encodeURI(it.k),d2=document.createElement("div");d2.className="it";
        const md=/\.(mp4|mov|webm)$/i.test(f)?Object.assign(document.createElement("video"),{src:u,controls:true,preload:"metadata",playsInline:true}):/\.(jpe?g|png|webp)$/i.test(f)?Object.assign(document.createElement("img"),{src:u,loading:"lazy",alt:f}):null;
        if(md)d2.append(md);
        const n=document.createElement("div");n.className="n";n.textContent=f;const mm=document.createElement("div");mm.className="m";mm.textContent=mb(it.t)+" · original, sem recompressão";
        const a=Object.assign(document.createElement("a"),{href:u,download:f,target:"_blank",rel:"noopener",textContent:/\.(mp4|mov)$/i.test(f)?"Baixar vídeo":"Baixar capa"});
        d2.append(n,mm,a);
        if(navigator.canShare){const sh=document.createElement("a");sh.className="b2";sh.href="#";sh.textContent="Salvar / compartilhar";sh.onclick=async e=>{e.preventDefault();const o=sh.textContent;sh.textContent="Preparando…";try{const bl=await (await fetch(u)).blob();const fl=new File([bl],f,{type:bl.type});if(navigator.canShare({files:[fl]}))await navigator.share({files:[fl]});else sh.textContent="Use Baixar"}catch(x){}sh.textContent=o};d2.append(sh)}
        const cp=document.createElement("a");cp.className="b2";cp.href="#";cp.textContent="Copiar link";cp.onclick=e=>{e.preventDefault();navigator.clipboard.writeText(new URL(u,location.href).href).then(()=>{cp.textContent="Copiado ✓";setTimeout(()=>cp.textContent="Copiar link",1800)})};d2.append(cp);
        g.append(d2);
      }
      box.append(g);
      const key=c+"/"+p,st=document.createElement("div");st.className="st";box.dataset.key=key;
      const sel=document.createElement("span");sel.className="sel";const bt=document.createElement("button");
      const pintar=()=>{const v=lg(key);sel.textContent=v;sel.style.background=COR[v];bt.textContent=PROX[v];box.dataset.st=v;rnd();filtrar()};
      const on=document.createElement("div");on.className="onde2";
      const rnd=()=>{on.innerHTML="";if(lg(key)!=="Postado"){on.style.display="none";return}on.style.display="";const sl=J("pf:"+key,[]),dt=J("pd:"+key,"");
        const h=document.createElement("div");h.textContent="Onde foi postado"+(dt?" ("+dt+")":"")+":";on.append(h);
        perfis().forEach(x=>{const c2=document.createElement("span");c2.className="ch"+(sl.includes(x)?" on":"");c2.textContent=(sl.includes(x)?"✓ ":"")+x;c2.onclick=()=>{const n=sl.includes(x)?sl.filter(y=>y!==x):[...sl,x];SJ("pf:"+key,n);rnd()};on.append(c2)});
        const ad=document.createElement("span");ad.className="ch add";ad.textContent="+ Cadastrar perfil";ad.onclick=()=>{const v=(prompt("Nome ou @ do perfil do Instagram:")||"").trim();if(!v)return;const l=perfis();if(!l.includes(v)){l.push(v);SJ("perfis",l)}document.querySelectorAll(".proj").forEach(b=>b._rnd&&b._rnd())};on.append(ad)};
      box._rnd=rnd;
      bt.onclick=()=>{const nv=ST[(ST.indexOf(lg(key))+1)%3];sg(key,nv);if(nv==="Postado")SJ("pd:"+key,new Date().toLocaleDateString("pt-BR"));pintar();abas()};st.append(sel,bt);box.insertBefore(st,t.nextSibling);box.insertBefore(on,st.nextSibling);setTimeout(pintar,0);
      const L=meta[key]&&meta[key].legenda;
      if(L){const lb=document.createElement("div");lb.className="leg";lb.textContent=L;const cb=document.createElement("button");cb.textContent="Copiar legenda";cb.onclick=()=>navigator.clipboard.writeText(L).then(()=>{cb.textContent="Copiado ✓";setTimeout(()=>cb.textContent="Copiar legenda",1800)});lb.append(document.createElement("br"),cb);box.append(lb)}
      else{const sm=document.createElement("div");sm.className="sem";sm.textContent="Legenda deste post: peça no chat que eu registro aqui.";box.append(sm)}
      box.dataset.q=(c+" "+p+" "+cli[c][p].map(i=>i.k).join(" ")).toLowerCase();m.append(box);
    }
  }
  window.filtrar=()=>{const v=document.getElementById("q").value.toLowerCase().trim();document.querySelectorAll(".proj").forEach(b=>b.style.display=(!v||b.dataset.q.includes(v))&&(FIL==="Todos"||b.dataset.st===FIL)?"":"none")};
  window.abas=()=>{const n={};document.querySelectorAll(".proj").forEach(b=>n[b.dataset.st]=(n[b.dataset.st]||0)+1);const tot=document.querySelectorAll(".proj").length;const ab=document.getElementById("abas");ab.innerHTML="";["Todos",...ST].forEach(x=>{const b=document.createElement("button");b.textContent=x+" ("+(x==="Todos"?tot:(n[x]||0))+")";b.className=x===FIL?"on":"";b.onclick=()=>{FIL=x;filtrar();abas()};ab.append(b)})};
  setTimeout(abas,50);
  document.getElementById("q").oninput=e=>{const v=e.target.value.toLowerCase().trim();filtrar()};
  if(!d.itens.length)m.innerHTML='<p id="vazio">Nenhuma entrega ainda.</p>';
}).catch(()=>{document.getElementById("m").innerHTML='<p id="vazio">Não consegui carregar a lista agora. Tente de novo em instantes.</p>'});
</script></body></html>
