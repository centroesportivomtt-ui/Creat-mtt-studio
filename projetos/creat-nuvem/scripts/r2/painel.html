<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entregas creat.MTT</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0f0d0c;--card:#1b1716;--tx:#f6efe9;--mut:#a89c94;--ac:#e3121b;--y:#ffd23f}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px 16px 60px}
header{max-width:960px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:26px;letter-spacing:-.02em}h1 b{color:var(--ac)}#at{color:var(--mut);font-size:13px}
main{max-width:960px;margin:0 auto}h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);margin:26px 0 10px}
.proj{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.proj h3{font-size:17px;margin-bottom:10px}.proj h3 span{color:var(--mut);font-weight:400;font-size:13px;margin-left:8px}
.itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.it{background:#251f1d;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.it video,.it img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
.it .n{padding:8px 10px 2px;font-size:13px;word-break:break-all}.it .m{padding:0 10px;color:var(--mut);font-size:12px}
.it a{margin:8px 10px 10px;text-align:center;background:var(--ac);color:#fff;text-decoration:none;border-radius:8px;padding:8px;font-weight:600;font-size:14px}
#vazio{color:var(--mut)}
</style></head><body>
<header><h1>Entregas <b>creat.MTT</b></h1><div id="at">carregando…</div></header>
<main id="m"><p id="vazio">Carregando entregas…</p></main>
<script>
const IDX="_painel/e160f58517f4.json";
const mb=t=>(t/1048576).toFixed(1).replace(".",",")+" MB";
const nome=s=>s.replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());
fetch(IDX,{cache:"no-store"}).then(r=>r.json()).then(d=>{
  document.getElementById("at").textContent="atualizado "+d.atualizado;
  const m=document.getElementById("m");m.innerHTML="";
  const cli={};
  for(const it of d.itens){const[c,p]=it.k.split("/");((cli[c]??={})[p]??=[]).push(it);}
  for(const c of Object.keys(cli).sort()){
    const h=document.createElement("h2");h.textContent=nome(c);m.append(h);
    for(const p of Object.keys(cli[c]).sort().reverse()){
      const box=document.createElement("section");box.className="proj";
      const t=document.createElement("h3");t.textContent=nome(p.slice(11));const s=document.createElement("span");s.textContent=p.slice(8,10)+"/"+p.slice(5,7)+"/"+p.slice(0,4);t.append(s);box.append(t);
      const g=document.createElement("div");g.className="itens";
      for(const it of cli[c][p]){
        const f=it.k.split("/").pop(),u=encodeURI(it.k),d2=document.createElement("div");d2.className="it";
        const md=/\.(mp4|mov|webm)$/i.test(f)?Object.assign(document.createElement("video"),{src:u,controls:true,preload:"metadata",playsInline:true}):/\.(jpe?g|png|webp)$/i.test(f)?Object.assign(document.createElement("img"),{src:u,loading:"lazy",alt:f}):null;
        if(md)d2.append(md);
        const n=document.createElement("div");n.className="n";n.textContent=f;const mm=document.createElement("div");mm.className="m";mm.textContent=mb(it.t)+" · original, sem recompressão";
        const a=Object.assign(document.createElement("a"),{href:u,download:f,textContent:"Baixar"});
        d2.append(n,mm,a);g.append(d2);
      }
      box.append(g);m.append(box);
    }
  }
  if(!d.itens.length)m.innerHTML='<p id="vazio">Nenhuma entrega ainda.</p>';
}).catch(()=>{document.getElementById("m").innerHTML='<p id="vazio">Não consegui carregar a lista agora. Tente de novo em instantes.</p>'});
</script></body></html>
