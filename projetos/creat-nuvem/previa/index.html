<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prévia do site | Creat</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Prévia gerada no seu navegador. Serviços, preços e textos são exemplo até o dono aprovar.">
  <meta name="theme-color" content="#1F1612">
  <link rel="stylesheet" href="../motor/v1/styles.css">
  <link rel="stylesheet" href="previa.css">
</head>
<body>
  <!--
    /previa/ · runtime da prévia do Porta Aberta (T4).
    Lê só o fragmento: #k=<nicho>&n=<nome>&c=<cidade>&p=<1..3>&utm_* (docs/CONTRATOS-DETALHE.md, item c).
    Monta o TenantConfig v1 com meta.previa = true a partir do preset e renderiza com motor/v1.
    Nenhuma requisição além das fontes do preset; nada é gravado no aparelho.
  -->
  <div id="motor-raiz">
    <div class="carregando" role="status" aria-live="polite">
      <div class="carregando-couro" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="carregando-texto">Montando o site...</p>
    </div>
  </div>
  <noscript>
    <div class="previa-noscript">
      <p>A prévia precisa de JavaScript para montar o seu site. Ative o JavaScript no navegador ou abra o link em outro navegador.</p>
    </div>
  </noscript>
  <script src="../motor/nichos/index.js"></script>
  <script src="previa.js"></script>
  <script src="../motor/v1/motor.js"></script>
  <script src="../motor/v1/efeito.js"></script>
  <script src="../motor/v1/som.js"></script>
  <script src="../motor/v1/agendamento.js"></script>
</body>
</html>
