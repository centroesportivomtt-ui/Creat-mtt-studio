<!doctype html>
<html lang="pt-BR">
<head>
  <!--
    motor/v1/template.html · página de todo site entregue do Porta Aberta (ADR-001).
    Preenchido pelo build-site.cjs (T9) com CreatMotor.preencherTemplate(texto, tenant, {preset, site, caminhoMotor}).
    Marcadores: {{TITULO}} {{DESCRICAO}} {{ROBOTS}} {{TEMA_COR}} {{FONTES_HREF}} {{NICHO}} {{MOTOR}}
    e os comentários JSONLD, CANONICAL e NOSCRIPT. Nada de dado de cliente aqui: tudo vem de tenant.js
    (gerado por CreatMotor.scriptTenant). Abre por duplo clique (file://): só scripts clássicos.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITULO}}</title>
  <meta name="description" content="{{DESCRICAO}}">
  <meta name="robots" content="{{ROBOTS}}">
  <meta name="theme-color" content="{{TEMA_COR}}">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!--{{CANONICAL}}-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{FONTES_HREF}}" data-motor-fontes>
  <link rel="stylesheet" href="{{MOTOR}}v1/styles.css">
  <!--{{JSONLD}}-->
  <script src="{{MOTOR}}nichos/index.js"></script>
  <script src="{{MOTOR}}nichos/{{NICHO}}.js"></script>
  <script src="tenant.js"></script>
  <script src="{{MOTOR}}v1/motor.js" defer></script>
  <script src="{{MOTOR}}v1/efeito.js" defer></script>
  <script src="{{MOTOR}}v1/som.js" defer></script>
  <script src="{{MOTOR}}v1/agendamento.js" defer></script>
</head>
<body>
  <div id="motor-raiz">
    <p class="sem-tenant" role="status">Abrindo o site...</p>
  </div>
  <noscript><!--{{NOSCRIPT}}--></noscript>
</body>
</html>
