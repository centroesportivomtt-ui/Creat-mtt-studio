<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | Creat</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<!-- Caminhos absolutos: o 404 é servido em qualquer endereço do site publicado. -->
<link rel="icon" href="/assets/svg/placa.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500&family=Lilita+One&display=swap">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/vitrine.css">
<link rel="stylesheet" href="/abrir/pedido.css">
<style>
.p404{min-height:70vh;display:grid;align-content:center;gap:var(--r4)}
.p404 img{width:180px;transform-origin:48.5% 7.3%;animation:balanca var(--duracao-balanco) var(--curva-balanco) infinite}
.p404 h1{font-size:var(--t-h1);max-width:14ch}
.p404 .linha{display:flex;flex-wrap:wrap;gap:var(--r3) var(--r4);align-items:center}
</style>
</head>
<body>
<main class="pagina" id="conteudo">
  <div class="cx p404">
    <img src="/assets/svg/placa.svg" alt="Placa de madeira com a palavra FECHADO, presa por uma correntinha" width="330" height="300">
    <span class="olho">Erro 404</span>
    <h1>Essa porta não existe.</h1>
    <p class="lead">O endereço pode ter mudado ou ter sido digitado com algum erro.</p>
    <div class="linha">
      <a class="btn btn-sol btn-g" href="/">Voltar para a home</a>
    </div>
    <p class="notas">Procurava a prévia do seu site? Digite o nome do negócio de novo na home.</p>
  </div>
</main>
</body>
</html>
