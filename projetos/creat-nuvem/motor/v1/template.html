<!doctype html>
<html lang="pt-BR">
<head>
  <!--
    motor/v1/template.html · página de todo site entregue do Porta Aberta (ADR-001).
    Preenchido pelo build-site.cjs (T9) com CreatMotor.preencherTemplate(texto, tenant, {preset, site, caminhoMotor}).
    Marcadores: {{TITULO}} {{DESCRICAO}} {{ROBOTS}} {{FONTES_HREF}} {{NICHO}} {{MOTOR}}
    e os comentários JSONLD, CANONICAL e NOSCRIPT (motor.js preencherTemplate). O build-site.cjs preenche
    {{ICONE}} {{NOME_SITE}} {{OG_URL}} {{OG_IMAGEM}} {{TWITTER_CARD}} {{TEMA_COR_CLARO}} {{TEMA_COR_ESCURO}} (pacote 3B, onda 3):
    ícone SVG em data URI com a inicial do negócio na cor de destaque (sem ele a hospedagem injeta o ícone
    dela na aba), cartão de link (og:*, twitter:card) e theme-color da faixa do topo no claro e no escuro;
    motor/v1/agendamento.js troca o theme-color[data-barra] pela cor real do topo e segue o botão de tema.
    og:url só com URL do site e og:image só da demonstração com assets/img/og-demo-<nicho>.jpg.
    Nada de dado de cliente aqui: tudo vem de tenant.js
    (gerado por CreatMotor.scriptTenant). Abre por duplo clique (file://): só scripts clássicos.
    CSP (pacote 1C, 10/11/2026): vale para todo site de cliente, rascunho e pacote SAIR. Só scripts
    da mesma origem; nenhum script inline (o JSON-LD é dado, não roda); conexões só com a mesma origem.
    Afrouxado o mínimo e registrado: style-src aceita o CSS do Google Fonts e UM <style> do motor,
    o CSS_VIVO de motor/v1/efeito.js, pelo hash; font-src aceita fonts.gstatic.com; style-src-attr
    aceita SÓ os 9 atributos style da poeira do gesto da academia (motor/v1/rituais/barra.js grava
    style="--i:..;--dx:.."; o motor é congelado, ADR-001), por hash com 'unsafe-hashes'. Qualquer
    outro atributo style (ex.: uma camada falsa injetada por cima da página) é bloqueado.
    Se CSS_VIVO ou a poeira mudarem, build-site.cjs recusa o build até os hashes daqui serem atualizados.
    frame-ancestors não vale em meta: a hospedagem já manda X-Frame-Options DENY.
  -->
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'sha256-EsgTL5Ah6OXo2kfwq7dSLLcmAZQZO1ShHcqo3SLFWbY='; style-src-attr 'unsafe-hashes' 'sha256-lmFgQfdHmG81Qw1Uln1KN1cPmRFtu25Vidy89TGtW/s=' 'sha256-BpTv4k+9Jmcb5zqmGTgx4ck9q7qaFgNHu1PY6tDC+Lk=' 'sha256-I3TJFzNbehzByHETR4Go4Dobp7EK+WK7weXeyzaEMLw=' 'sha256-dSUxP0vcFIPKzPG14DlqhRTvUDcId6gNTMeF1THdcU4=' 'sha256-DjKopOLK4CtHDuuYZmD1Tks5qNxefXNFHDjs3pU6B0A=' 'sha256-nA2goikx6PmiCRG3Eyjk2cJGmeMkI+kBakNefJb1pS8=' 'sha256-SgnG8mu/pg4jdFMEGBh2rUuaDdPxInaJ9jTT72ESmAA=' 'sha256-UZHTVzrIMqOYWBIjT7HJuqpbZvCSW2ukiyPSu7sY2/4=' 'sha256-OlhEnP9PWSTc2skOkKv66gxIGhdNbvlcLxQhA863Px4='; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITULO}}</title>
  <meta name="description" content="{{DESCRICAO}}">
  <meta name="robots" content="{{ROBOTS}}">
  <meta name="theme-color" content="{{TEMA_COR_CLARO}}" media="(prefers-color-scheme: light)" data-barra>
  <meta name="theme-color" content="{{TEMA_COR_ESCURO}}" media="(prefers-color-scheme: dark)" data-barra>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="{{ICONE}}" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="{{NOME_SITE}}">
  <meta property="og:title" content="{{TITULO}}">
  <meta property="og:description" content="{{DESCRICAO}}">
  <!--{{OG_URL}}-->
  <!--{{OG_IMAGEM}}-->
  <meta name="twitter:card" content="{{TWITTER_CARD}}">
  <!--{{CANONICAL}}-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{FONTES_HREF}}" data-motor-fontes>
  <link rel="stylesheet" href="{{MOTOR}}v1/styles.css">
  <!--{{JSONLD}}-->
  <script src="{{MOTOR}}nichos/index.js"></script>
  <script src="{{MOTOR}}nichos/{{NICHO}}.js"></script>
  <script src="tenant.js"></script>
  <script src="{{MOTOR}}v1/motor.js" defer></script>
  <script src="{{MOTOR}}v1/efeito.js" defer></script>
  <script src="{{MOTOR}}v1/som.js" defer></script>
  <script src="{{MOTOR}}v1/agendamento.js" defer></script>
</head>
<body>
  <div id="motor-raiz">
    <p class="sem-tenant" role="status">Abrindo o site...</p>
  </div>
  <noscript><!--{{NOSCRIPT}}--></noscript>
</body>
</html>
