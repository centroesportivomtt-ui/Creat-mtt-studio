    <path d="M15 6.5 V19.5"/>
  </symbol>

  <symbol id="i-gps" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>minha posição</title>
    <circle cx="12" cy="12" r="7"/>
    <circle fill="currentColor" stroke="none" cx="12" cy="12" r="2.8"/>
    <path d="M12 1.8 V5 M12 19 V22.2 M1.8 12 H5 M19 12 H22.2"/>
  </symbol>

  <symbol id="i-gravar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
