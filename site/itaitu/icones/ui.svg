<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Ícones da interface (Paleta, 20/11/2026). Grade 24x24, traço 2 em currentColor, ponta redonda.
       Uso: <svg class="icone" aria-hidden="true"><use href="./icones/ui.svg#i-gps"/></svg>
       O texto do botão diz o que ele faz; o ícone é sempre aria-hidden.
       Nenhuma marca de terceiros: i-whatsapp é um balão de conversa genérico, não o logotipo. -->

  <symbol id="i-norte" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>norte</title>
    <path d="M12 2.5 L17.5 20 L12 16.2 L6.5 20 Z"/>
    <path fill="currentColor" stroke="none" d="M12 2.5 L12 16.2 L6.5 20 Z"/>
  </symbol>

  <symbol id="i-camadas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>camadas</title>
