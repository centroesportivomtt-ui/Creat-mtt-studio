    <path d="M3 12.5 L12 17.5 L21 12.5"/>
    <path d="M3 16.5 L12 21.5 L21 16.5"/>
  </symbol>

  <symbol id="i-3d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <title>relevo 3D</title>
